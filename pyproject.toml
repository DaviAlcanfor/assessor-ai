[project]
name = "assessor-ai"
version = "0.1.0"
description = "Personal AI agent for financial management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk[fastapi]>=1.1.2",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "alembic>=1.18.5",
    "annotated-types==0.8.0",
    "anthropic==0.95.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "bcrypt>=5.0.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "cryptography==50.0.1",
    "dataclasses-json==0.6.7",
    "distro==1.9.0",
    "docstring-parser==0.18.0",
    "faker>=40.36.0",
    "fastapi-guard>=7.4.1",
    "fastapi[standard]>=0.141.1",
    "filetype==1.2.0",
    "frozenlist==1.8.0",
    "google-auth==2.57.0",
    "google-genai==1.73.1",
    "greenlet==3.5.5",
    "groq==0.37.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.19",
    "infisicalsdk>=1.0.16",
    "jiter==0.16.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain==1.2.15",
    "langchain-anthropic==1.4.0",
    "langchain-classic==1.0.7",
    "langchain-community==0.4.2",
    "langchain-core==1.4.0",
    "langchain-google-genai==4.2.2",
    "langchain-groq==1.1.3",
    "langchain-protocol==0.0.19",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.1.6",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langgraph-prebuilt==1.0.9",
    "langgraph-sdk==0.3.13",
    "langsmith==0.11.2",
    "marshmallow==3.26.2",
    "multidict==6.7.1",
    "mypy-extensions==1.1.0",
    "numpy==2.5.2",
    "orjson==3.12.0",
    "ormsgpack==1.12.2",
    "packaging==26.3",
    "propcache==0.5.2",
    "psycopg2==2.9.12",
    "psycopg[binary,pool]>=3.3.4",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.1",
    "pydantic-core==2.46.1",
    "pydantic-settings==2.15.0",
    "pyfiglet>=1.0.4",
    "pymongo>=4.12,<4.17",
    "pypdf==6.16.2",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "qdrant-client>=1.18.0",
    "redis>=8.0.0",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "rich>=15.0.0",
    "slowapi>=0.1.10",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.52",
    "tenacity==9.1.4",
    "textual>=8.2.8",
    "typing-extensions==4.16.0",
    "typing-inspect==0.9.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
    "uuid-utils==0.17.0",
    "websockets==16.0",
    "xxhash==4.0.1",
    "yarl==1.24.5",
    "zstandard==0.25.0",
]

[project.scripts]
assessor-ai = 'main:main'

[tool.fastapi]
entrypoint = "interfaces.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "interfaces", "src/assessor_ai"]
include = ["main.py"]

[tool.pytest.ini_options]
# auto: função de teste async vira teste asyncio sem precisar de marcador em cada uma
# (a cadeia chat/service/nós virou async, então quase todo teste de fluxo é async agora)
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "BLE001", # catch-all + log + Response.error é o padrão intencional das tools (log_tool não captura exceção)
]
